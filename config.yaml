# Copy to config.local.yaml for personal addresses/settings (ignored by Git).
# Every relative path is resolved from the directory containing THIS YAML.
llm:
  base_url: http://127.0.0.1:1234/v1  # IP A; include /v1
  model: "google/gemma-4-e2b"
  api_key_env: null                 # e.g. LLM_API_KEY; null for an unauthenticated LAN server
  timeout: 300
  temperature: 0.9
  refinement_temperature: 0.3
  max_tokens: 4096
  token_limit_field: max_tokens     # or max_completion_tokens if your server requires it
  send_reference_images: false      # true only when LLM A accepts image_url vision input
  extra_body: {}                   # e.g. chat_template_kwargs: {enable_thinking: false}

comfy:
  base_url: http://192.168.1.186:8188/     # IP B
  api_key_env: null
  request_timeout: 60
  job_timeout: 9999999                 # includes time spent waiting in ComfyUI's queue
  poll_interval: 2
  get_retries: 3                    # GET only; submissions/uploads are never auto-retried
  retry_delay: 1

characters:
  directory: assets/characters
  protagonist: A  # Random A<number>.jpg reference; Qwen socket 1
  creature: B     # Random B<number>.jpg reference; Qwen socket 2

prompts:
  activities: prompts/activities.json # Set null to disable activity sampling
  planning: prompts/plan_scene.md
  refinement: prompts/refine_scene.md
  guide: docs/Qwen_Image_2_1_Ultimate_Prompt_Guide.md

generation:
  outpainting: true                # UI toggle default for new sessions
  type: viking_duo                  # Two reference characters, Qwen Edit + Flux outpaint
  count: 10
  width: 1024                       # Qwen canvas, multiples of 32
  height: 1024
  seed: null                        # null = random; integer = seed + 2*sticker_index, then +1 for Flux

output:
  directory: output
  width: 1624                       # final JPEG width M; may be any positive integer
  height: 1624                      # final JPEG height N
  jpeg_quality: 95
  jpeg_subsampling: 0               # 0 = 4:4:4, useful for illustration edges; 2 = smaller files
  jpeg_background: "#ffffff"        # JPEG cannot keep transparency
  feathering: 24
  preserve_center: true             # composite the intermediate back, feathering its edges

  # Appended to the original scene for Flux; empty string preserves raw-only behavior.
  outpainting_prompt: >-
    Continue the existing image as one uninterrupted scene through all four edges.
    Match the source image's art style, palette, exposure, light direction, perspective,
    and level of detail at the boundary. Extend the visible ground, plants, architecture,
    water and sky where they meet the edges, with coherent shapes and readable texture.
    Keep foreground and midground detail as clear as the adjacent source; use atmospheric
    softness only for genuinely distant scenery. Maintain consistent illumination through
    the outer margins. No vignette, foggy border, blurred frame, tunnel effect, dark halo,
    radial blur, new depth-of-field blur, or extra characters. Preserve the existing scene
    and character identity; only complete the surrounding environment.

workflows:
  qwen:
    path: workflows/qwen-edit.json
    nodes:
      protagonist: "514"
      creature: "516"
      encoder: "459:474"
      latent: "459:456"
      sampler: "459:458"
      output: "461"
    overrides: {}                   # e.g. "459:458": {steps: 30, cfg: 1.4}
  flux:
    path: workflows/flux-outpaint.json
    nodes:
      image: "47"
      prompt: "23"
      pad: "44"
      sampler: "3"
      conditioning: "38"
      output: "9"
    overrides:
      "3": {steps: 50}                   # e.g. "31": {unet_name: flux1-fill-dev.safetensors}
