<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Little adventures · Image review</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <a
        id="sessions-link"
        href="/sessions"
        aria-label="Back to review sessions"
        >←</a
      >
      <h1 id="title">Review sessions</h1>
      <a
        id="mode-toggle"
        aria-label="Switch to gallery mode"
        title="Gallery mode"
        >◉</a
      >
    </header>
    <div id="confirmation" aria-hidden="true"></div>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <main>
      <nav id="categories" aria-label="Review categories"></nav>
      <p id="error" role="alert"></p>
      <button id="retry" hidden>Retry saved action</button>
      <section id="review">
        <div id="carousel" aria-label="Image gallery" tabindex="0" hidden></div>
        <div class="stage" id="stage">
          <img
            id="underneath"
            alt=""
            aria-hidden="true"
            draggable="false"
            hidden
          />
          <img id="hero" alt="Illustration to review" draggable="false" />
          <div id="empty" hidden>
            <h2>You're all caught up.</h2>
            <p>Your choices are saved. Come back when new images arrive.</p>
            <button id="reload">Check for new images</button>
          </div>
          <div id="gesture" aria-hidden="true"></div>
        </div>
        <div class="toolbar">
          <button id="undo" aria-label="Undo last choice">
            ↶<span>Undo</span>
          </button>
          <button id="reject" data-action="reject" aria-label="Reject image">
            ✕<span>Reject</span></button
          ><button
            id="favorite"
            data-action="favorite"
            aria-label="Mark favorite"
          >
            ☆<span>Favorite</span></button
          ><button
            id="tshirt"
            data-action="tshirt"
            aria-label="Mark T-shirt candidate"
          >
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path
                d="M11 4 4 8 1 15l6 3 2-4v14h14V14l2 4 6-3-3-7-7-4c0 5-10 5-10 0Z"
              /></svg
            ><span>T-shirt</span></button
          ><button id="accept" data-action="accept" aria-label="Accept image">
            ✓<span>Accept</span>
          </button>
        </div>
        <button id="next" hidden>Next image →</button>
        <span id="progress" aria-live="polite"></span>
      </section>
      <section id="grid" hidden></section>
      <section id="sessions" hidden></section>
    </main>
  </body>
</html>
