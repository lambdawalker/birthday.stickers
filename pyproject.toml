[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "birthday-stickers"
version = "0.1.0"
description = "Plan scenes with an OpenAI-compatible LLM, render with Qwen, and outpaint with ComfyUI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6,<4",
    "Pillow>=11,<13",
    "PyYAML>=6.0.2,<7",
    "textual>=1,<7",
]

[project.scripts]
birthday-repair-glasses = "birthday_stickers.batch_repair:main"
birthday-outpaint = "birthday_stickers.batch_outpaint:main"
birthday-stickers = "birthday_stickers.cli:main"
birthday-convert-to-jpg = "birthday_stickers.convert_to_jpg:main"
birthday-center-dragon = "birthday_stickers.center_dragon:main"
birthday-keep-wifi = "birthday_stickers.keep_wifi_connected:main"
birthday-gallery-fix = "birthday_stickers.gallery:main"


[tool.hatch.build.targets.wheel]
packages = ["src/birthday_stickers"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
